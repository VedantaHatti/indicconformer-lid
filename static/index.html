<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Language ID</title>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --surface2: #243044;
      --text: #e8eef7;
      --muted: #8b9cb3;
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.35);
      --success: #34d399;
      --danger: #f87171;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: radial-gradient(ellipse 80% 60% at 50% -10%, #1e3a5f 0%, var(--bg) 55%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: min(440px, 100%);
      background: var(--surface);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: var(--radius);
      padding: 32px 28px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.35);
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 28px;
      line-height: 1.45;
    }

    .mic-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
    }

    .mic-btn {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(145deg, #2563eb, #1d4ed8);
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 8px 24px var(--accent-glow);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .mic-btn:hover { transform: scale(1.04); }
    .mic-btn:active, .mic-btn.recording {
      transform: scale(0.96);
      box-shadow: 0 0 0 12px var(--accent-glow), 0 4px 16px var(--accent-glow);
    }

    .mic-btn.recording { background: linear-gradient(145deg, #dc2626, #b91c1c); }
    .mic-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

    .mic-btn svg { width: 36px; height: 36px; }

    .hint {
      font-size: 0.85rem;
      color: var(--muted);
      text-align: center;
    }

    .result {
      background: var(--surface2);
      border-radius: 12px;
      padding: 20px;
      min-height: 120px;
    }

    .result-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .language {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }

    .language-code {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 16px;
    }

    .scores { display: flex; flex-direction: column; gap: 8px; }

    .score-row {
      display: grid;
      grid-template-columns: 52px 1fr 48px;
      align-items: center;
      gap: 10px;
      font-size: 0.82rem;
    }

    .score-row .bar-wrap {
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 3px;
      overflow: hidden;
    }

    .score-row .bar {
      height: 100%;
      background: var(--accent);
      border-radius: 3px;
      transition: width 0.4s ease;
    }

    .score-row.top .bar { background: var(--success); }

    .score-row .val {
      text-align: right;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .status {
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
      padding: 24px 0;
    }

    .status.error { color: var(--danger); }

    .pulse {
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Language Identification</h1>
    <p class="subtitle">Hold the button and speak. Release to identify the language.</p>

    <div class="mic-wrap">
      <button class="mic-btn" id="micBtn" type="button" aria-label="Hold to speak">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
          <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
        </svg>
      </button>
      <span class="hint" id="hint">Hold to record</span>
    </div>

    <div class="result" id="result">
      <div class="status" id="status">Waiting for speech…</div>
    </div>
  </div>

  <script>
    const LANG_NAMES = {
      hi: "Hindi", kn: "Kannada", mr: "Marathi", ta: "Tamil", te: "Telugu",
      as: "Assamese", bn: "Bengali", gu: "Gujarati", ml: "Malayalam",
      pa: "Punjabi", ur: "Urdu", ne: "Nepali", or: "Odia", sa: "Sanskrit",
    };

    const micBtn = document.getElementById("micBtn");
    const hint = document.getElementById("hint");
    const result = document.getElementById("result");

    let mediaStream = null;
    let audioContext = null;
    let processor = null;
    let source = null;
    let recording = false;
    let samples = [];

    async function initMic() {
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        hint.textContent = "Hold to record";
      } catch (err) {
        micBtn.disabled = true;
        showError("Microphone access denied.");
      }
    }

    function showError(msg) {
      result.innerHTML = `<div class="status error">${msg}</div>`;
    }

    function showLoading() {
      result.innerHTML = `<div class="status pulse">Identifying…</div>`;
    }

    function encodeWav(float32, sampleRate) {
      const buffer = new ArrayBuffer(44 + float32.length * 2);
      const view = new DataView(buffer);
      const writeStr = (off, s) => { for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); };
      writeStr(0, "RIFF");
      view.setUint32(4, 36 + float32.length * 2, true);
      writeStr(8, "WAVE");
      writeStr(12, "fmt ");
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeStr(36, "data");
      view.setUint32(40, float32.length * 2, true);
      let off = 44;
      for (let i = 0; i < float32.length; i++) {
        const s = Math.max(-1, Math.min(1, float32[i]));
        view.setInt16(off, s < 0 ? s * 0x8000 : s * 0x7fff, true);
        off += 2;
      }
      return new Blob([buffer], { type: "audio/wav" });
    }

    function downsample(buffer, fromRate, toRate) {
      if (fromRate === toRate) return buffer;
      const ratio = fromRate / toRate;
      const len = Math.round(buffer.length / ratio);
      const out = new Float32Array(len);
      for (let i = 0; i < len; i++) {
        out[i] = buffer[Math.round(i * ratio)];
      }
      return out;
    }

    async function startRecording() {
      if (!mediaStream || recording) return;
      recording = true;
      samples = [];
      micBtn.classList.add("recording");
      hint.textContent = "Listening… release to identify";

      audioContext = new AudioContext();
      source = audioContext.createMediaStreamSource(mediaStream);
      processor = audioContext.createScriptProcessor(4096, 1, 1);
      processor.onaudioprocess = (e) => {
        if (recording) samples.push(new Float32Array(e.inputBuffer.getChannelData(0)));
      };
      source.connect(processor);
      processor.connect(audioContext.destination);
    }

    async function stopRecording() {
      if (!recording) return;
      recording = false;
      micBtn.classList.remove("recording");
      hint.textContent = "Hold to record";

      processor.disconnect();
      source.disconnect();
      const rate = audioContext.sampleRate;
      await audioContext.close();

      const total = samples.reduce((n, c) => n + c.length, 0);
      if (total < rate * 0.3) {
        showError("Too short — hold the button and speak for at least half a second.");
        return;
      }

      const merged = new Float32Array(total);
      let offset = 0;
      for (const chunk of samples) {
        merged.set(chunk, offset);
        offset += chunk.length;
      }

      const pcm = downsample(merged, rate, 16000);
      const wav = encodeWav(pcm, 16000);
      await identify(wav);
    }

    async function identify(blob) {
      showLoading();
      const form = new FormData();
      form.append("audio", blob, "speech.wav");
      try {
        const res = await fetch("/identify", { method: "POST", body: form });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || res.statusText);
        renderResult(data);
      } catch (err) {
        showError(err.message || "Identification failed.");
      }
    }

    function renderResult(data) {
      const code = data.language;
      if (!code) {
        showError("Could not identify language. Try speaking more clearly.");
        return;
      }

      const name = LANG_NAMES[code] || code.toUpperCase();
      const margin = data.margin != null ? data.margin.toFixed(3) : "—";
      const candidates = data.top_candidates || [];
      const scores = candidates.map((c) => c.score);
      const min = Math.min(...scores);
      const max = Math.max(...scores);
      const range = max - min || 1;

      const rows = candidates.map((c, i) => {
        const pct = ((c.score - min) / range) * 100;
        return `
          <div class="score-row ${i === 0 ? "top" : ""}">
            <span>${c.language}</span>
            <div class="bar-wrap"><div class="bar" style="width:${pct}%"></div></div>
            <span class="val">${c.score.toFixed(2)}</span>
          </div>`;
      }).join("");

      result.innerHTML = `
        <div class="result-label">Detected language</div>
        <div class="language">${name}</div>
        <div class="language-code">${code} · margin ${margin}</div>
        <div class="scores">${rows}</div>`;
    }

    micBtn.addEventListener("mousedown", startRecording);
    micBtn.addEventListener("mouseup", stopRecording);
    micBtn.addEventListener("mouseleave", () => { if (recording) stopRecording(); });
    micBtn.addEventListener("touchstart", (e) => { e.preventDefault(); startRecording(); });
    micBtn.addEventListener("touchend", (e) => { e.preventDefault(); stopRecording(); });

    initMic();
  </script>
</body>
</html>
